<section class="bg-gray-50 dark:bg-gray-900">
  <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
    <a href="#" class="flex items-center mb-6 text-2xl font-semibold text-gray-900 dark:text-white">
      <img class="w-8 h-8 mr-2" src="https://res.cloudinary.com/dm3elzg4i/image/upload/q_auto/f_auto/v1779149383/ChatGPT_Image_18_may_2026_19_09_11_r4u4bg.png"
           alt="logo">
      FourParks
    </a>
    <div
      class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-700">
      <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
          Iniciar Sesión
        </h1>
        <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="space-y-4 md:space-y-6">
          <div>
            <label for="username" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nombre de
              usuario</label>
            <input type="text" name="username" id="username" formControlName="user_name"
                   class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                   placeholder="Juan_Rojas" required="">
          </div>
          <div>
            <label for="password"
                   class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contraseña</label>
            <input type="password" name="password" id="password" formControlName="password" placeholder="••••••••"
                   class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                   required="">
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input id="remember" aria-describedby="remember" type="checkbox"
                       class="w-4 h-4 border border-gray-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary-300 dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-primary-600 dark:ring-offset-gray-800"
                       required="">
              </div>
              <div class="ml-3 text-sm">
                <label for="remember" class="text-gray-500 dark:text-gray-300">Recuerdame</label>
              </div>
            </div>
            <a routerLink="/forgot-password"
               class="text-sm font-medium text-blue-600 hover:underline">¿Olvidaste tu contraseña?</a>
          </div>
          <button type="submit" [disabled]="loading"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-60">
            <span *ngIf="!loading">Iniciar Sesión</span>
            <span *ngIf="loading">Cargando...</span>
          </button>
          <p class="text-sm font-light text-gray-500">
            ¿No tienes una cuenta? <a routerLink="/register" class="font-medium text-blue-600 hover:underline">Crear una cuenta</a>
          </p>
          <p class="text-sm font-light text-gray-500">
            ¿No verificaste tu cuenta? <a routerLink="/send-verify" class="font-medium text-blue-600 hover:underline">Verificar cuenta</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
